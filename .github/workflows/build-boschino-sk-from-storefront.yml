name: Build Boschino SK OpenAI feed from storefront

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-boschino-sk-from-storefront.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch SK products and build OpenAI feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out .feed-staging
          python - <<'PY'
          import csv
          import html
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          BASE='https://boschino.sk'
          OUT='/tmp/out/boschino-sk-ads-full.txt'
          FIELDS=['item_id','title','description','url','brand','image_url','price','availability','is_eligible_search','is_eligible_checkout','is_ads_eligible','seller_name','seller_url','gtin','mpn','product_category','condition']

          class TextExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts=[]
              def handle_data(self, data):
                  if data and data.strip(): self.parts.append(data.strip())

          def strip_html(value):
              p=TextExtractor()
              try:
                  p.feed(value or '')
                  text=' '.join(p.parts)
              except Exception:
                  text=re.sub(r'<[^>]+>', ' ', value or '')
              return re.sub(r'\s+', ' ', html.unescape(text)).strip()

          def get_json(url, attempts=4):
              last=None
              for attempt in range(attempts):
                  try:
                      req=urllib.request.Request(url, headers={
                          'User-Agent':'Mozilla/5.0 (compatible; BoschinoFeedBuilder/1.0)',
                          'Accept':'application/json',
                          'Accept-Language':'sk-SK,sk;q=0.9'
                      })
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except Exception as e:
                      last=e
                      time.sleep(2*(attempt+1))
              raise last

          products=[]
          since_id=0
          page=0
          seen_product_ids=set()
          while True:
              page += 1
              url=f'{BASE}/products.json?limit=250&since_id={since_id}'
              payload=get_json(url)
              batch=payload.get('products') or []
              print(f'page={page} products={len(batch)} since_id={since_id}')
              if not batch:
                  break
              new=0
              max_id=since_id
              for product in batch:
                  pid=int(product.get('id') or 0)
                  if pid <= 0 or pid in seen_product_ids:
                      continue
                  seen_product_ids.add(pid)
                  products.append(product)
                  new += 1
                  max_id=max(max_id,pid)
              if new == 0 or max_id <= since_id:
                  break
              since_id=max_id
              if len(batch) < 250:
                  break
              if page >= 1000:
                  raise SystemExit('Safety stop: too many pages')
              time.sleep(0.15)

          print(f'Fetched products={len(products)}')
          if len(products) < 1000:
              raise SystemExit(f'Refusing suspiciously small storefront catalog: {len(products)} products')

          rows=[]
          seen_ids=set()
          for product in products:
              handle=str(product.get('handle') or '').strip()
              title=str(product.get('title') or '').strip()
              description=strip_html(product.get('body_html') or '') or title
              vendor=str(product.get('vendor') or '').strip()
              product_type=str(product.get('product_type') or '').strip()
              images=product.get('images') or []
              product_image=''
              if images and isinstance(images[0], dict):
                  product_image=str(images[0].get('src') or '').strip()

              brand=vendor
              if brand in {'BSH / Bosch','Boschino.cz','Boschino.sk'}:
                  brand='Bosch'
              elif brand == 'BSH - Bosch, Siemens':
                  brand='Bosch | Siemens'

              variants=product.get('variants') or []
              for variant in variants:
                  vid=str(variant.get('id') or '').strip()
                  if not vid:
                      continue
                  item_id=f'shopify_SK_{vid}'
                  if item_id in seen_ids:
                      continue

                  vtitle=str(variant.get('title') or '').strip()
                  final_title=title if not vtitle or vtitle == 'Default Title' else f'{title} - {vtitle}'
                  price=str(variant.get('price') or '').strip()
                  compare=str(variant.get('compare_at_price') or '').strip()
                  try:
                      effective=price
                      if compare and float(price) < float(compare):
                          effective=price
                      if not effective:
                          continue
                      price_value=f'{float(effective):.2f} EUR'
                  except Exception:
                      continue

                  vimage=product_image
                  fi=variant.get('featured_image')
                  if isinstance(fi, dict) and fi.get('src'):
                      vimage=str(fi.get('src')).strip()
                  if not vimage:
                      continue

                  sku=str(variant.get('sku') or '').strip()
                  barcode=str(variant.get('barcode') or '').strip()
                  mpn=sku
                  if not mpn:
                      m=re.search(r'(?<!\d)(\d{8})(?!\d)', final_title)
                      if m: mpn=m.group(1)

                  available=bool(variant.get('available'))
                  url=f'{BASE}/products/{handle}'
                  rows.append({
                      'item_id':item_id,
                      'title':final_title,
                      'description':description,
                      'url':url,
                      'brand':brand,
                      'image_url':vimage,
                      'price':price_value,
                      'availability':'in_stock' if available else 'out_of_stock',
                      'is_eligible_search':'true',
                      'is_eligible_checkout':'false',
                      'is_ads_eligible':'true',
                      'seller_name':'Boschino.sk',
                      'seller_url':BASE,
                      'gtin':barcode,
                      'mpn':mpn,
                      'product_category':product_type,
                      'condition':'new'
                  })
                  seen_ids.add(item_id)

          if len(rows) < 1000:
              raise SystemExit(f'Refusing suspiciously small transformed feed: {len(rows)} rows')

          with open(OUT,'w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=FIELDS,delimiter='\t',lineterminator='\n')
              w.writeheader(); w.writerows(rows)

          ins=sum(1 for r in rows if r['availability']=='in_stock')
          print(f'Validated {len(rows)} unique SK variants; in_stock={ins}; out_of_stock={len(rows)-ins}')
          PY

          xz -c -9 /tmp/out/boschino-sk-ads-full.txt > .feed-staging/boschino-sk-ads-full.txt.xz
          sha256sum /tmp/out/boschino-sk-ads-full.txt .feed-staging/boschino-sk-ads-full.txt.xz
          ls -lh /tmp/out/boschino-sk-ads-full.txt .feed-staging/boschino-sk-ads-full.txt.xz

      - name: Commit staging snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .feed-staging/boschino-sk-ads-full.txt.xz
          git commit -m 'Stage Boschino SK OpenAI Ads feed snapshot'
          git push origin HEAD:main
