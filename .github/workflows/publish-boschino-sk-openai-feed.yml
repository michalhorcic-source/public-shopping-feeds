name: Publish Boschino SK OpenAI Ads feed snapshot

on:
  push:
    branches: [main]
    paths:
      - '.feed-staging/boschino-sk-ads-full.txt.xz'
      - '.github/workflows/publish-boschino-sk-openai-feed.yml'

permissions:
  contents: write

jobs:
  publish-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decompress and validate SK full feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p openai
          test -s .feed-staging/boschino-sk-ads-full.txt.xz
          xz -dc .feed-staging/boschino-sk-ads-full.txt.xz > openai/boschino-sk-ads-full.txt

          python - <<'PY'
          import csv
          from urllib.parse import urlparse

          path='openai/boschino-sk-ads-full.txt'
          expected=['item_id','title','description','url','brand','image_url','price','availability','is_eligible_search','is_eligible_checkout','is_ads_eligible','seller_name','seller_url','gtin','mpn','product_category','condition']

          with open(path, encoding='utf-8', newline='') as f:
              r=csv.DictReader(f, delimiter='\t')
              if r.fieldnames != expected:
                  raise SystemExit(f'Unexpected columns: {r.fieldnames}')

              ids=set()
              rows=0
              eur_rows=0
              sk_url_rows=0
              in_stock=0
              out_of_stock=0

              for row in r:
                  rows += 1
                  for key in ('item_id','title','url','image_url','price'):
                      if not row.get(key):
                          raise SystemExit(f'Missing {key} at row {rows + 1}')

                  if row['item_id'] in ids:
                      raise SystemExit(f'Duplicate item_id: {row["item_id"]}')
                  ids.add(row['item_id'])

                  if 'EUR' in row['price'].upper():
                      eur_rows += 1

                  host=urlparse(row['url']).hostname or ''
                  if host == 'boschino.sk' or host.endswith('.boschino.sk'):
                      sk_url_rows += 1

                  if row['availability'] == 'in_stock':
                      in_stock += 1
                  elif row['availability'] == 'out_of_stock':
                      out_of_stock += 1
                  else:
                      raise SystemExit(f'Unexpected availability at row {rows + 1}: {row["availability"]}')

              if rows < 1000:
                  raise SystemExit(f'Refusing suspiciously small SK feed: {rows} rows')
              if eur_rows != rows:
                  raise SystemExit(f'Non-EUR prices found: EUR rows {eur_rows}/{rows}')
              if sk_url_rows != rows:
                  raise SystemExit(f'Non-boschino.sk URLs found: SK URL rows {sk_url_rows}/{rows}')

              print(f'Validated {rows} unique SK products; in_stock={in_stock}; out_of_stock={out_of_stock}')
          PY

      - name: Publish feed and remove staging archive
        shell: bash
        run: |
          set -euo pipefail
          rm -f .feed-staging/boschino-sk-ads-full.txt.xz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A openai/boschino-sk-ads-full.txt .feed-staging
          git commit -m 'Publish full Boschino SK OpenAI Ads feed snapshot [skip ci]'
          git push origin HEAD:main
