name: Build Boschino SK ChatGPT Ads feed

on:
  schedule:
    - cron: '30 5 * * *' # 06:30 Europe/Prague during CET.
    - cron: '30 4 * * *' # 06:30 Europe/Prague during CEST; duplicate run is skipped by the local guard.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boschino-sk-chatgpt-ads-feed
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Continue only at 06:30 Europe/Prague for scheduled runs
        id: local_time
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Europe/Prague date +%H:%M)" != "06:30" ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install OAuth dependency
        if: steps.local_time.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check --no-input 'google-auth==2.38.0'

      - name: Build and validate production CSV
        if: steps.local_time.outputs.run == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail
          python scripts/build_boschino_sk_feed.py \
            --output openai/boschino-ads-sk-full.txt \
            --state openai/boschino-ads-sk-state.json
          cp openai/boschino-ads-sk-full.txt openai/boschino-ads-sk-full.csv
          python tests/test_boschino_sk_feed.py
          git diff --check

      - name: Commit and push only validated changes
        if: steps.local_time.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- openai/boschino-ads-sk-full.txt openai/boschino-ads-sk-full.csv openai/boschino-ads-sk-state.json; then
            echo 'No SK feed changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openai/boschino-ads-sk-full.txt openai/boschino-ads-sk-full.csv openai/boschino-ads-sk-state.json
          git commit -m 'Update Boschino SK ChatGPT Ads feed [skip ci]'
          git push origin HEAD:main
