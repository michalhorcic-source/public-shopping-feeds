name: Deploy public feed endpoint

on:
  push:
    branches: [main]
    paths:
      - 'openai/boschino-ads-full.csv'
      - 'openai/boschino-ads-sk-full.csv'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: openai
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
