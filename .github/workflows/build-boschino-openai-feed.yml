name: Build Boschino OpenAI Ads feed

on:
  push:
    branches: [main]
    paths:
      - '.feed-staging/READY'

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble compact snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .feed-staging/parts/*.b64 > /tmp/boschino-feed.xz.b64
          base64 -d /tmp/boschino-feed.xz.b64 > /tmp/boschino-feed.tsv.xz
          xz -dc /tmp/boschino-feed.tsv.xz > /tmp/boschino-feed.tsv
          test "$(($(wc -l < /tmp/boschino-feed.tsv)-1))" -eq 51819

      - name: Build Ads Manager feed
        shell: python
        run: |
          import csv, pathlib

          src = pathlib.Path('/tmp/boschino-feed.tsv')
          out = pathlib.Path('openai/boschino-ads-full.txt')
          out.parent.mkdir(parents=True, exist_ok=True)

          fields = [
              'item_id','title','description','url','brand','image_url','price',
              'availability','is_eligible_search','is_eligible_checkout',
              'is_ads_eligible','seller_name','seller_url','gtin','mpn',
              'product_category','condition'
          ]
          shopify_prefix = 'https://cdn.shopify.com/s/files/1/1001/0741/9979/files/'
          boschino_prefix = 'https://boschino.cz/cdn/shop/files/'
          placeholder = ('https://boschino.cz/cdn/shop/files/'
                         'Obrazek_neni_IKONA_BOSCHINO_fab28cee-a44a-4055-a6e0-3dce91058ad4.jpg'
                         '?v=1775658146&width=1200')

          def expand_image(value):
              if value.startswith('s:'):
                  return shopify_prefix + value[2:]
              if value.startswith('b:'):
                  return boschino_prefix + value[2:]
              if value.startswith('u:'):
                  return value[2:] or placeholder
              return value or placeholder

          rows = 0
          ids = set()
          with src.open(encoding='utf-8', newline='') as fi, out.open('w', encoding='utf-8', newline='') as fo:
              r = csv.DictReader(fi, delimiter='\t')
              w = csv.DictWriter(fo, fieldnames=fields, delimiter='\t', lineterminator='\n', quoting=csv.QUOTE_MINIMAL)
              w.writeheader()
              for x in r:
                  item_id = x['i'].strip()
                  path = x['h'].strip()
                  title = x['t'].strip()
                  mpn = x['m'].strip()
                  gtin = x['g'].strip()
                  brand = 'Bosch | Siemens' if 'siemens' in title.lower() or 'bosch-siemens' in path.lower() else 'Bosch'
                  row = {
                      'item_id': item_id,
                      'title': title,
                      'description': f'{title}. Náhradní díl nebo příslušenství pro spotřebiče {brand}. Kompatibilitu ověřte podle úplného E-Nr spotřebiče.',
                      'url': 'https://boschino.cz' + path,
                      'brand': brand,
                      'image_url': expand_image(x['im'].strip()),
                      'price': x['p'].strip() + ' CZK',
                      'availability': 'in_stock' if x['a'].strip() == '1' else 'out_of_stock',
                      'is_eligible_search': 'true',
                      'is_eligible_checkout': 'false',
                      'is_ads_eligible': 'true',
                      'seller_name': 'Boschino.cz',
                      'seller_url': 'https://boschino.cz',
                      'gtin': gtin,
                      'mpn': mpn,
                      'product_category': '',
                      'condition': 'new',
                  }
                  if not all(row[k] for k in ('item_id','title','url','image_url','price')):
                      raise SystemExit(f'Missing required value for {item_id}')
                  if item_id in ids:
                      raise SystemExit(f'Duplicate item_id: {item_id}')
                  ids.add(item_id)
                  w.writerow(row)
                  rows += 1

          if rows != 51819:
              raise SystemExit(f'Expected 51819 products, got {rows}')
          print(f'Built {rows} products: {out.stat().st_size} bytes')

      - name: Publish snapshot and remove staging payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .feed-staging/parts .feed-staging/READY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A openai/boschino-ads-full.txt .feed-staging
          git commit -m 'Publish full Boschino OpenAI Ads feed snapshot [skip ci]'
          git push origin HEAD:main
