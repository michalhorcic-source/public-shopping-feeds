name: Publish Boschino OpenAI Ads feed snapshot

on:
  push:
    branches: [main]
    paths:
      - '.feed-staging/boschino-ads-full.txt.xz'

permissions:
  contents: write

jobs:
  publish-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decompress and validate full feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p openai
          xz -dc .feed-staging/boschino-ads-full.txt.xz > openai/boschino-ads-full.txt
          test "$(($(wc -l < openai/boschino-ads-full.txt)-1))" -eq 51819
          python - <<'PY'
          import csv
          path='openai/boschino-ads-full.txt'
          expected=['item_id','title','description','url','brand','image_url','price','availability','is_eligible_search','is_eligible_checkout','is_ads_eligible','seller_name','seller_url','gtin','mpn','product_category','condition']
          with open(path,encoding='utf-8',newline='') as f:
              r=csv.DictReader(f,delimiter='\t')
              if r.fieldnames != expected:
                  raise SystemExit(f'Unexpected columns: {r.fieldnames}')
              ids=set(); rows=0
              for row in r:
                  rows += 1
                  for key in ('item_id','title','url','image_url','price'):
                      if not row.get(key):
                          raise SystemExit(f'Missing {key} at row {rows + 1}')
                  if row['item_id'] in ids:
                      raise SystemExit(f'Duplicate item_id: {row["item_id"]}')
                  ids.add(row['item_id'])
              if rows != 51819:
                  raise SystemExit(f'Expected 51819 products, got {rows}')
              print(f'Validated {rows} unique products')
          PY

      - name: Publish feed and remove staging archive
        shell: bash
        run: |
          set -euo pipefail
          rm -f .feed-staging/boschino-ads-full.txt.xz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A openai/boschino-ads-full.txt .feed-staging
          git commit -m 'Publish full Boschino OpenAI Ads feed snapshot [skip ci]'
          git push origin HEAD:main
